appId: com.nightfury.app
productName: Nightfury.gg
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
extraResources:
  - from: build/icon.ico
    to: icon.ico
  - from: build/icon.png
    to: icon.png
win:
  target:
    - target: portable
      arch: [x64]
mac:
  target: [dmg]
  category: public.app-category.utilities
